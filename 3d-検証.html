<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くるまこうじょう：3D 技術検証</title>
<style>
  :root { --ink:#e8eef2; --sub:#93a4b0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#10161b; color:var(--ink);
    font:14px/1.6 "Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif; overflow:hidden; }
  #stage { position:absolute; inset:0; }
  #stage canvas { display:block; width:100%; height:100%; }

  .panel { position:absolute; left:12px; top:12px; background:rgba(16,22,27,.82);
    border:1px solid #2b3740; border-radius:12px; padding:12px 14px; max-width:330px; backdrop-filter:blur(6px); }
  .panel h1 { font-size:1rem; margin:0 0 4px; }
  .panel p { margin:0 0 10px; font-size:.78rem; color:var(--sub); }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; align-items:center; }
  .row b { flex:0 0 100%; font-size:.72rem; color:var(--sub); font-weight:400; }
  button { font:inherit; font-size:.78rem; padding:5px 10px; border-radius:8px; cursor:pointer;
    background:#1d2830; color:var(--ink); border:1px solid #33424d; }
  button[aria-pressed="true"] { background:#e85d2b; border-color:#e85d2b; color:#fff; }
  .sw { width:26px; height:26px; border-radius:50%; padding:0; border:2px solid #33424d; }
  .hint { font-size:.72rem; color:var(--sub); margin-top:6px; }
  #fps { position:absolute; right:12px; top:12px; background:rgba(16,22,27,.82); border:1px solid #2b3740;
    border-radius:8px; padding:6px 10px; font:12px ui-monospace,monospace; color:var(--sub); }
</style>
</head>
<body>
<div id="stage"></div>

<div class="panel">
  <h1>3D 技術検証（断面ロフト方式）</h1>
  <p>側面図を押し出す方式は側面が平らな板になり石けん箱に見えたため、<b>先頭から末尾まで少しずつ形の違う輪切りを並べて面を張る</b>方式に変えた版。ドラッグで視点、ホイールで寄り引き。</p>
  <div class="row"><b>いろ</b><span id="colors"></span></div>
  <div class="row"><b>しあげ</b>
    <button data-fin="gloss" aria-pressed="true">つやあり</button>
    <button data-fin="metal">メタリック</button>
    <button data-fin="matte">つやけし</button>
  </div>
  <div class="row"><b>ばめん</b>
    <button data-scene="factory" aria-pressed="true">こうじょう</button>
    <button data-scene="studio">スタジオ</button>
  </div>
  <div class="row"><b>ボディをすかす（カットモデル）</b>
    <button data-cut="off" aria-pressed="true">ふつう</button>
    <button data-cut="on">中を見る</button>
  </div>
  <div class="row"><b>かたち</b>
    <button data-wire="off" aria-pressed="true">面</button>
    <button data-wire="on">輪切りを見る</button>
  </div>
  <div class="hint">自動で回転します。画面をドラッグすると止まります。</div>
</div>
<div id="fps">--</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';
import { OrbitControls } from './vendor/OrbitControls.js';

/* ============================================================
   断面ロフト方式

   押し出し（ExtrudeGeometry）は、側面図をそのまま真横に伸ばすので
   側面が完全な平面になり、どんなに良い材質を当てても石けん箱に見える。

   実車の面は、前から後ろへ向かって断面が少しずつ変わることで作られる。
   ・鼻先は細く、ドアのあたりで最も広く、尻でまた絞る
   ・ドアの面はまっすぐではなく、ベルトラインの下で最も張り出す（ショルダー）
   ・キャビンは下部より細く、屋根に向かってさらに絞られる（タンブルホーム）

   そこで「x座標ごとの輪切り（断面）」を関数で定義し、隣り合う輪切りを
   面でつないでボディを作る。ホイールアーチは、車軸の近くだけ断面の底を
   持ち上げることで表現する。
   ============================================================ */

// ---- 図面座標（2D版と共通）→ 3D座標 ----
const GROUND = 96, REAR = 26, FRONT = 200, AX_R = 64, AX_F = 162;
const TR = 12, ARCH = 15.0, ROCKER = 78, ROOF = 37.6;
const AX_Y = GROUND - TR;
const S = 0.02;
const X3 = xf => (xf - 113) * S;          // 前後（+が前）
const Y3 = yf => (GROUND - yf) * S;       // 高さ（+が上）
const W = 0.78;                            // 最大半幅

// 折れ線を滑らかにたどる（区間ごとに smoothstep で補間）
function track(pts, x) {
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, v0] = pts[i], [x1, v1] = pts[i + 1];
    if (x <= x1) { const t = (x - x0) / (x1 - x0); return v0 + (v1 - v0) * (t * t * (3 - 2 * t)); }
  }
  return pts[pts.length - 1][1];
}

// 下部ボディの上面（ベルトライン）
const BELT = [[26, 68], [34, 59.4], [52, 58.0], [88, 57.4], [150, 56.6], [180, 57.2], [192, 59.5], [200, 67]];
// 屋根のライン。キャビンのある範囲だけ持ち上がる
const ROOFL = [[86, 57.4], [93, 45], [99, 38.4], [104, 37.6], [124, 37.6], [132, 41], [142, 49], [152, 56.6]];
// 半幅（前後で絞る）
const HALFW = [[26, 0.50], [36, 0.80], [56, 0.97], [76, 1.0], [156, 1.0], [176, 0.95], [190, 0.82], [200, 0.55]];
// キャビンの半幅
const ROOFW = [[86, 0.30], [98, 0.74], [124, 0.74], [140, 0.56], [152, 0.30]];
// 車体の下端（前後をわずかに持ち上げてアプローチアングルを作る）
const ROCKERL = [[26, 74.5], [36, 78], [186, 78], [200, 74.5]];

const CABIN_X0 = 86, CABIN_X1 = 152;      // キャビンのある範囲
const beltY = xf => Y3(track(BELT, xf));
// 範囲の外では屋根＝ベルトライン。clamp に任せると
// ボンネットやトランクにも薄いキャビンが生えて面が崩れる。
const roofY = xf => (xf < CABIN_X0 || xf > CABIN_X1)
  ? beltY(xf) : Math.max(beltY(xf), Y3(track(ROOFL, xf)));
const halfW = xf => track(HALFW, xf) * W;
const roofW = xf => track(ROOFW, xf) * W;

// ホイールアーチ。車軸の近くだけ、断面の**外側だけ**を持ち上げる。
// 断面の底を丸ごと上げると車体の裏側までえぐれて、くびれた形になる。
function archY(xf) {
  let y = -1;
  for (const ax of [AX_R, AX_F]) {
    const d = Math.abs(xf - ax);
    if (d < ARCH) y = Math.max(y, Y3(AX_Y) + Math.sqrt(ARCH * ARCH - d * d) * S);
  }
  return y;
}

const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerpV = (p, q, t) => new THREE.Vector2(p.x + (q.x - p.x) * t, p.y + (q.y - p.y) * t);

// ---- 1枚の輪切りを作る ----
// 制御点の**個数と意味を常に同じ**に保つのが要。断面ごとに点の構成を
// 変えると、隣の輪切りと結んだときに面がねじれて崩れる。
const RING_HALF = 26;
function section(xf) {
  const yFloor = Y3(track(ROCKERL, xf));
  const yArch = Math.max(yFloor, archY(xf));
  const yBelt = beltY(xf), yRoof = roofY(xf);
  const wB = halfW(xf), wR = roofW(xf);
  const h = yRoof - yBelt;
  const blend = smooth(0.004, 0.07, h);      // 0＝キャビン無し、1＝キャビン有り

  const cp = [
    new THREE.Vector2(0, yFloor),                                   // 床の中央（低いまま）
    new THREE.Vector2(wB * 0.58, yFloor + (yArch - yFloor) * 0.28),
    new THREE.Vector2(wB * 0.92, yArch),                            // アーチのふち
    new THREE.Vector2(wB * 1.00, yArch + (yBelt - yArch) * 0.55),   // 最も張り出す（ショルダー）
    new THREE.Vector2(wB * 0.965, yBelt)
  ];
  // 上半分は「盛り上がったデッキ」と「キャビン」を混ぜる。
  // 切り替えではなく連続的に混ぜることで、面のねじれを防ぐ。
  const crown = 0.024;
  const deck = [
    new THREE.Vector2(wB * 0.86, yBelt + crown * 0.45),
    new THREE.Vector2(wB * 0.58, yBelt + crown * 0.85),
    new THREE.Vector2(wB * 0.30, yBelt + crown),
    new THREE.Vector2(wB * 0.12, yBelt + crown),
    new THREE.Vector2(0, yBelt + crown)
  ];
  const cabin = [
    new THREE.Vector2(wR * 1.04, yBelt + h * 0.18),
    new THREE.Vector2(wR * 1.00, yBelt + h * 0.56),                 // タンブルホーム
    new THREE.Vector2(wR * 0.82, yRoof - h * 0.12),
    new THREE.Vector2(wR * 0.42, yRoof),
    new THREE.Vector2(0, yRoof)
  ];
  for (let i = 0; i < 5; i++) cp.push(lerpV(deck[i], cabin[i], blend));

  const half = new THREE.SplineCurve(cp).getPoints(RING_HALF - 1);   // z>=0 の半分
  const ring = half.slice();
  for (let i = half.length - 2; i >= 1; i--) ring.push(new THREE.Vector2(-half[i].x, half[i].y));
  return ring;   // 長さ 2*RING_HALF-2
}

// ---- 輪切りを並べて面を張る ----
const STATIONS = 96;
function buildBody() {
  const rings = [], xs = [];
  for (let i = 0; i < STATIONS; i++) {
    const xf = REAR + (FRONT - REAR) * (i / (STATIONS - 1));
    xs.push(xf); rings.push(section(xf));
  }
  const N = rings[0].length;
  const pos = [];
  rings.forEach((r, i) => r.forEach(p => pos.push(X3(xs[i]), p.y, p.x)));

  // まどの範囲（この面だけガラスの材質にする）
  const isGlass = (xf, y, z) => {
    const yb = beltY(xf), yr = roofY(xf), h = yr - yb;
    if (h < 0.06) return false;                            // キャビンが立ち上がっている所だけ
    if (y < yb + 0.030 || y > yb + h * 0.80) return false;  // 腰から上、屋根の手前まで
    if (Math.abs(z) < roofW(xf) * 0.72) return false;      // 屋根の天面は塗装のまま
    return (xf > 91 && xf < 116) || (xf > 122 && xf < 144);
  };

  const paintIdx = [], glassIdx = [];
  for (let i = 0; i < STATIONS - 1; i++) {
    for (let j = 0; j < N; j++) {
      const j2 = (j + 1) % N;
      const a = i * N + j, b = i * N + j2, c = (i + 1) * N + j2, d = (i + 1) * N + j;
      const xf = (xs[i] + xs[i + 1]) / 2;
      const y = (rings[i][j].y + rings[i + 1][j2].y) / 2;
      const z = (rings[i][j].x + rings[i + 1][j2].x) / 2;
      (isGlass(xf, y, z) ? glassIdx : paintIdx).push(a, b, c, a, c, d);
    }
  }
  // 前後のふさぎ（中心へ扇状に）
  const capStart = paintIdx.length;
  [0, STATIONS - 1].forEach(i => {
    const base = i * N;
    const cx = X3(xs[i]);
    let sy = 0, sz = 0;
    rings[i].forEach(p => { sy += p.y; sz += p.x; });
    const ci = pos.length / 3;
    pos.push(cx, sy / N, sz / N);
    for (let j = 0; j < N; j++) {
      const j2 = (j + 1) % N;
      if (i === 0) paintIdx.push(ci, base + j2, base + j);
      else paintIdx.push(ci, base + j, base + j2);
    }
  });

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(paintIdx.concat(glassIdx));
  g.addGroup(0, paintIdx.length, 0);
  g.addGroup(paintIdx.length, glassIdx.length, 1);
  g.computeVertexNormals();
  return g;
}

// ---- 場面 ----
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
camera.position.set(4.4, 1.8, 5.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.minDistance = 2.2; controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI / 2 - 0.04;
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
controls.addEventListener('start', () => { controls.autoRotate = false; });

const pmrem = new THREE.PMREMGenerator(renderer);
const envRoom = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// 工場の映り込み。天井の蛍光灯が塗装面に細長い光の筋として乗る
function factoryEnv() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x0d1319);
  s.add(new THREE.Mesh(new THREE.BoxGeometry(20, 9, 20),
    new THREE.MeshBasicMaterial({ color: 0x121b22, side: THREE.BackSide })));
  const lamp = (w, h, x, y, z, c, i) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c }));
    m.material.color.multiplyScalar(i); m.position.set(x, y, z); m.lookAt(0, y, 0); s.add(m);
  };
  for (let i = -2; i <= 2; i++) lamp(9, 0.45, 0, 4.2, i * 3.0, 0xffffff, 7);
  for (let i = -2; i <= 2; i++) lamp(0.45, 9, i * 3.0, 4.2, 0, 0xffffff, 7);
  for (let i = -1; i <= 1; i++) { lamp(3.2, 2.6, -9.6, 2.2, i * 4, 0xdff0ff, 3.4); lamp(3.2, 2.6, 9.6, 2.2, i * 4, 0xdff0ff, 3.4); }
  lamp(4, 2.6, 0, 2.0, -9.6, 0xcfe6f5, 2.2);
  return s;
}
const envFactory = pmrem.fromScene(factoryEnv(), 0.03).texture;

const key = new THREE.DirectionalLight(0xfff2dd, 2.3);
key.position.set(3.2, 5.2, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 16;
key.shadow.camera.left = -3.5; key.shadow.camera.right = 3.5;
key.shadow.camera.top = 3.5; key.shadow.camera.bottom = -3.5;
key.shadow.bias = -0.0008; key.shadow.radius = 3;
scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd8ff, 0.55); fill.position.set(-3, 2.4, -2.4); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

const floorMat = new THREE.MeshStandardMaterial({ color: 0x2b3238, roughness: 0.26 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// ---- 材質 ----
const paint = new THREE.MeshPhysicalMaterial({
  color: 0xd94f24, roughness: 0.20, metalness: 0.0,
  clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.6, side: THREE.DoubleSide
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x2a3f4c, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.55,
  envMapIntensity: 2.2, side: THREE.DoubleSide
});
const chrome = new THREE.MeshStandardMaterial({ color: 0xdfe8ec, roughness: 0.13, metalness: 1, envMapIntensity: 1.6 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x1b2226, roughness: 0.88 });
const dark = new THREE.MeshStandardMaterial({ color: 0x273136, roughness: 0.6, metalness: 0.3 });

const car = new THREE.Group(); scene.add(car);

const bodyGeo = buildBody();
const body = new THREE.Mesh(bodyGeo, [paint, glassMat]);
body.castShadow = true; body.receiveShadow = true;
car.add(body);

// 輪切りの可視化（形の作り方を確認するため）
const wire = new THREE.LineSegments(
  new THREE.WireframeGeometry(bodyGeo),
  new THREE.LineBasicMaterial({ color: 0x7fd2ff, transparent: true, opacity: 0.35 }));
wire.visible = false; car.add(wire);

// ---- タイヤ ----
const R = TR * S, WW = 0.21;
function wheel() {
  const g = new THREE.Group();
  const cyl = (r, h, mat, seg) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 36), mat);
    m.rotation.z = Math.PI / 2; return m;
  };
  const tread = cyl(R, WW, rubber); tread.castShadow = true; g.add(tread);
  g.add(cyl(R * 0.93, WW * 1.02, rubber));
  g.add(cyl(R * 0.66, WW * 0.9, dark));
  const disc = cyl(R * 0.52, WW * 0.5, dark, 24); disc.position.z = WW * 0.1; g.add(disc);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(R * 0.66, R * 0.055, 10, 40), chrome);
  rim.rotation.y = Math.PI / 2; rim.position.z = WW * 0.46; g.add(rim);
  for (let i = 0; i < 5; i++) {
    const sp = new THREE.Mesh(new THREE.BoxGeometry(R * 0.16, R * 1.22, R * 0.1), chrome);
    sp.rotation.z = (i / 5) * Math.PI * 2; sp.position.z = WW * 0.4; g.add(sp);
  }
  const hub = cyl(R * 0.17, WW * 0.6, chrome, 20); hub.position.z = WW * 0.42; g.add(hub);
  return g;
}
[[AX_R, 1], [AX_R, -1], [AX_F, 1], [AX_F, -1]].forEach(([cx, side]) => {
  const w = wheel();
  // ホイールの外側の面を、その位置の車体外側とほぼ面一にする
  w.position.set(X3(cx), R, side * (halfW(cx) - WW / 2 - 0.01));
  if (side < 0) w.rotation.y = Math.PI;
  car.add(w);
});

// ---- 中身（カットモデル用）----
const guts = new THREE.Group(); guts.visible = false; car.add(guts);
const metal = new THREE.MeshStandardMaterial({ color: 0x6b7b85, roughness: 0.4, metalness: 0.85, envMapIntensity: 1.2 });
const seatMat = new THREE.MeshStandardMaterial({ color: 0x8a5c4a, roughness: 0.85 });
const blk = (w, h, d, xf, y, z, mat) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(X3(xf), y, z); guts.add(m); return m;
};
blk(0.52, 0.30, 0.68, 172, 0.46, 0, metal);
for (let i = 0; i < 4; i++) blk(0.09, 0.10, 0.09, 163 + i * 6, 0.64, 0, chrome);
blk(0.26, 0.20, 0.34, 152, 0.42, 0, metal);
blk(1.5, 0.05, 0.05, 110, 0.32, 0, metal);
blk(0.5, 0.18, 0.86, 62, 0.38, 0, new THREE.MeshStandardMaterial({ color: 0x6f8a94, roughness: 0.5, metalness: 0.4 }));
[104, 130].forEach(xf => {
  blk(0.14, 0.42, 0.32, xf, 0.70, 0.24, seatMat);
  blk(0.14, 0.42, 0.32, xf, 0.70, -0.24, seatMat);
});

// ---- 切り替え ----
const COLORS = [0xd94f24, 0x2f6ba8, 0xf2b705, 0x3f8f5c, 0xe7ecef, 0x1d242a];
const swWrap = document.getElementById('colors');
COLORS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'sw'; b.style.background = '#' + c.toString(16).padStart(6, '0');
  b.onclick = () => paint.color.setHex(c);
  swWrap.appendChild(b);
});
function group(sel, fn) {
  document.querySelectorAll(sel).forEach(b => b.onclick = () => {
    document.querySelectorAll(sel).forEach(o => o.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); fn(b.dataset);
  });
}
group('[data-fin]', d => {
  if (d.fin === 'gloss') Object.assign(paint, { roughness: 0.20, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.04 });
  if (d.fin === 'metal') Object.assign(paint, { roughness: 0.30, metalness: 0.8, clearcoat: 1, clearcoatRoughness: 0.08 });
  if (d.fin === 'matte') Object.assign(paint, { roughness: 0.72, metalness: 0.0, clearcoat: 0.2, clearcoatRoughness: 0.5 });
  paint.needsUpdate = true;
});
group('[data-scene]', d => {
  const f = d.scene === 'factory';
  scene.environment = f ? envFactory : envRoom;
  scene.background = new THREE.Color(f ? 0x141c22 : 0xdfe6ea);
  floorMat.color.setHex(f ? 0x2b3238 : 0xc9d2d8);
  key.intensity = f ? 2.3 : 1.8;
});
group('[data-cut]', d => {
  const on = d.cut === 'on';
  guts.visible = on;
  paint.transparent = on; paint.opacity = on ? 0.22 : 1; paint.needsUpdate = true;
  glassMat.opacity = on ? 0.10 : 0.55;
});
group('[data-wire]', d => { wire.visible = d.wire === 'on'; });

scene.environment = envFactory;
scene.background = new THREE.Color(0x141c22);

// ---- ループ ----
let last = performance.now(), frames = 0, acc = 0;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  const now = performance.now(); acc += now - last; last = now; frames++;
  if (acc > 500) { document.getElementById('fps').textContent = Math.round(frames / (acc / 1000)) + ' fps'; frames = 0; acc = 0; }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
